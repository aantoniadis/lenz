[package]
name = "lenz-terminal-ui"
description = "Terminal input and field presentation shared by the Lenz adapters"
license = "MIT"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
lenz-content.workspace = true
crossterm = { version = "0.29.0", features = ["event-stream", "use-dev-tty"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
unicode-width = "0.2.2"

[lints]
workspace = true
