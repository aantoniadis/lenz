[package]
name = "lenz-tui"
description = "Lenz terminal frontend"
license = "MIT"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
gui-test = ["lenz/gui-test"]

[dependencies]
lenz = { path = "../app", default-features = false }
lenz-engine = { path = "../engine" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
# `use-dev-tty`: level-triggered poll(2); the default mio source reads 1 KiB per edge and leaves a longer burst
# unread until the next key arrives.
crossterm = { version = "0.29.0", features = ["event-stream", "use-dev-tty"] }
# Already built for crossterm: restores the terminal on SIGTERM/SIGHUP.
signal-hook = "0.3.18"
futures-lite = "2.6.1"
async-channel = "2.5.0"
async-io = "2.6.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3"
# The in-process memory probe for the terminal perf tests; test builds only.
lenz = { path = "../app", default-features = false, features = ["perf-probe"] }

[lints]
workspace = true
