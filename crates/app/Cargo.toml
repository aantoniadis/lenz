[package]
name = "lenz"
description = "A side-by-side diff viewer"
license = "MIT"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:lenz-gpui", "dep:gpui_platform", "dep:unicode-segmentation", "dep:x11rb", "dep:raw-window-handle", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "resvg/raster-images"]
gui-test = ["gui", "gpui/test-support"]
# In-process memory probe for the benchmark and test targets of every frontend; never in shipping binaries.
perf-probe = ["lenz-content/perf-probe"]

[[bin]]
name = "lenz"
path = "src/main.rs"
required-features = ["gui"]
test = false

[dependencies]
unicode-segmentation = { version = "1.13.3", optional = true }
lenz-engine = { path = "../engine" }
# Decoding, line offsets and syntax highlighting, shared with the code reader.
lenz-content = { path = "../content" }
pulldown-cmark = { version = "=0.13.6", default-features = false }
gpui = { workspace = true, optional = true }
# Single-pane text presentation shared with the code reader.
lenz-gpui = { path = "../gpui", optional = true }
# Zero-width detection for the combining-mark cap (src/document.rs); the TUI already builds it.
unicode-width = "0.2"
# Image decoding (src/images.rs). Same version and a subset of the features gpui already enables, so it unifies: nothing new to compile.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# SVG rasterising (src/images.rs); embedded raster data is enabled for GUI builds.
resvg = { version = "0.49.0", default-features = false }
# gh JSON and the Viewed Marks file (src/pr.rs); already built for gpui.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
# Archives shown as folders (src/archive.rs); pure Rust codecs.
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz", "optimization"] }
ruzstd = "0.9.1"
crc32fast = "1.5"
# Private, exclusively created files for atomic saves and Git merge inputs.
tempfile = "3"
async-channel = "2.5.0"

[dev-dependencies]
# The in-process memory probe for this crate's tests.
lenz-content = { path = "../content", features = ["perf-probe", "git-testing", "write-testing"] }
# XZ archive fixture generation.
lzma-rust2 = { version = "0.24", default-features = false, features = ["encoder"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, optional = true, features = ["font-kit"] }
# The Dock icon (src/dock_icon.rs); the versions gpui already builds.
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
gpui_platform = { workspace = true, optional = true, features = ["wayland", "x11"] }
# Prompt presentation after input on X11 (src/ui/present.rs).
x11rb = { version = "0.14", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
