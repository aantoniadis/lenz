[package]
name = "lenz"
description = "A side-by-side diff viewer"
license = "MIT"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui_platform", "dep:unicode-segmentation", "dep:x11rb", "dep:raw-window-handle", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]
gui-test = ["gui", "gpui/test-support"]
# In-process memory probe for the benchmark and test targets of every frontend; never in shipping binaries.
perf-probe = []

[[bin]]
name = "lenz"
path = "src/main.rs"
required-features = ["gui"]
test = false

[dependencies]
unicode-segmentation = { version = "1.13.3", optional = true }
lenz-engine = { path = "../engine" }
pulldown-cmark = { version = "=0.13.4", default-features = false }
gpui = { workspace = true, optional = true }
# Zero-width detection for the combining-mark cap (src/document.rs); the TUI already builds it.
unicode-width = "0.2"
# Per-Side decoding (src/encoding.rs).
encoding_rs = "0.8.42"
chardetng = "1.0.0"
# Image decoding (src/images.rs). Same version and a subset of the features gpui already enables, so it unifies: nothing new to compile.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# SVG rasterising (src/images.rs); the version gpui already builds, so nothing new to compile.
resvg = { version = "0.46", default-features = false }
# gh JSON and the Viewed Marks file (src/pr.rs); already built for gpui.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
notify = "8.2.0"
# Private, exclusively created files for atomic saves and Git merge inputs.
tempfile = "3"
async-channel = "2.5.0"
# Syntax highlighting: runtime + one crate per bundled grammar (see src/highlight/LANGUAGES.md).
tree-sitter = "0.27"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.3"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, optional = true, features = ["font-kit"] }
# The Dock icon (src/dock_icon.rs); the versions gpui already builds.
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
gpui_platform = { workspace = true, optional = true, features = ["wayland", "x11"] }
# Prompt presentation after input on X11 (src/ui/present.rs); the versions gpui already builds.
x11rb = { version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
