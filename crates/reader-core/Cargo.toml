[package]
name = "reader-core"
description = "Headless core of the Lenz code reader: documents, commands and state"
license = "MIT"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
lenz-content.workspace = true
# Completion channels the adapter awaits; the version lenz-content already uses.
async-channel = "2.5.0"
# Project enumeration with .gitignore/.ignore rules (ripgrep's walker).
ignore = "0.4"
# Recent roots.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Cargo manifests, for rust-analyzer's workspace discovery (already in the tree through lenz-content).
toml = "1.1.8"
# Following external file changes; the version lenz-content already uses.
notify = "8.2.0"
# Literal text search (ripgrep's libraries).
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
# File patterns for project search (ripgrep's, already in the tree through `ignore`).
globset = "0.4"
# Content validation; already in the workspace dependency graph.
sha2 = "0.10.9"

[build-dependencies]
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"
# Encoding image fixtures (already in the tree through lenz-content).
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
