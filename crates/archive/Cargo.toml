[package]
name = "lenz-archive"
description = "Bounded in-memory archive browsing and preserving member replacement shared by Lenz"
license = "MIT"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
testing = []

[dependencies]
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "unreserved"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz", "optimization", "encoder"] }
ruzstd = "0.9.1"
crc32fast = "1.5"

[lints]
workspace = true
