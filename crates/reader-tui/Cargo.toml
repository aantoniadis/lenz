[package]
name = "reader-tui"
description = "The Lenz code reader's terminal adapter"
license = "MIT"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "lenz-reader-tui"
path = "src/main.rs"

[features]
# Combined adapter replay only; the standalone TUI build does not link GPUI.
gui-test = ["dep:reader-gui", "dep:gpui"]

[dependencies]
reader-core = { path = "../reader-core" }
lenz-content.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-lite = "2.6.1"
async-io = "2.6.0"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
base64 = "0.22.1"
reader-gui = { path = "../reader-gui", optional = true, features = ["test-support"] }
gpui = { workspace = true, optional = true, features = ["test-support"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
