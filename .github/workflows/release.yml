name: Release

# Builds the release tarballs on native runners when a version tag is pushed and attaches them to a draft release;
# notes, pre-release and publishing stay manual. Rerun for an existing tag from the Actions tab; a published
# release is left alone. "Test build only" builds the tarballs (kept as run artifacts) without attaching them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, such as v0.0.5
        required: true
      test_only:
        description: Test build only (keep the tarballs as run artifacts; attach nothing)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 gives the glibc 2.35 floor that packaging/build-linux.sh gets from its container; macos-26
        # builds with Xcode 26 and the macOS 26 SDK (the binaries still run on macOS 11 and later). Pinned, not
        # -latest, so a label change never alters a release build unannounced.
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches the workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG" || { echo "tag $TAG does not match workspace version $version" >&2; exit 1; }

      - name: Linux build dependencies (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libx11-xcb-dev libvulkan1 libglib2.0-dev libzstd-dev libclang-dev

      - name: macOS build setup (Metal toolchain for gpui's shaders, target folder)
        if: runner.os == 'macOS'
        # Xcode 16 ships the Metal compiler and has no -downloadComponent; Xcode 26 downloads it on demand.
        run: |
          xcodebuild -version
          xcrun metal --version || { xcodebuild -downloadComponent MetalToolchain && xcrun metal --version; }
          # Outside the runner's home: gpui's shaders record their build folder (package.sh does this itself since
          # 0.0.5; set here too so a run for the v0.0.5 tag builds).
          echo "CARGO_TARGET_DIR=/tmp/lenz-dist" >> "$GITHUB_ENV"

      - name: Rust stable
        shell: bash
        run: |
          # our own rustup in ~/.cargo/bin, even when the image has Rust elsewhere on PATH (macos-26 since 2026-10)
          test -x "$HOME/.cargo/bin/rustup" || curl -sSf https://sh.rustup.rs | RUSTUP_INIT_SKIP_PATH_CHECK=yes sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal
          "$HOME/.cargo/bin/rustup" default stable

      - run: packaging/package.sh "${TAG#v}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.os }}
          path: target/package/lenz-*.tar.gz*
          if-no-files-found: error

  release:
    needs: package
    if: ${{ !inputs.test_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c ./*.sha256
          # A published release keeps its assets: rebuilt tarballs differ, and the formula pins their checksums.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            test "$draft" = true || { echo "$TAG is published; its assets stay as they are" >&2; exit 1; }
          else
            gh release create "$TAG" --draft --verify-tag --title "Lenz ${TAG#v}" --notes "Notes to come."
          fi
          gh release upload "$TAG" ./* --clobber
