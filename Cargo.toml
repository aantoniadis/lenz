[workspace]
resolver = "3"
members = ["crates/engine", "crates/content", "crates/gpui", "crates/app", "crates/tui", "crates/reader-core", "crates/reader-gui", "crates/reader-tui", "crates/launcher"]

[workspace.package]
edition = "2024"
version = "0.0.1"
publish = false

# Lints that have no hits today stay at zero. Panic-prone patterns that do have hits are held to a baseline
# by `scripts/panic-sites.py` in CI instead.
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
lenz-content = { path = "crates/content" }
lenz-gpui = { path = "crates/gpui" }
gix-imara-diff = "0.3"
# One tag for both so a bump moves every gpui reference together.
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.22.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.22.0" }

# Zed's workspace patches don't propagate to dependents; mirror the ones gpui needs.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
# Zed's own patch names no rev; pin the commit Cargo.lock resolved so `cargo update` cannot float it.
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.release]
debug = "line-tables-only"
# A wrapped integer is a wrong range, possibly in a file being saved: abort with a crash report instead.
# Measured cost on the engine benchmarks: 0–5%, about 1.5% on average (2026-10-08 audit). `dist` inherits it.
overflow-checks = true

# Shipping profile: cross-crate optimization and compact binaries.
# Release retains line tables for local profiling.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
# Retain function symbols so crash reports from shipped binaries remain useful.
strip = "debuginfo"
panic = "abort"
debug = false
